<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix India – Watch TV Shows Online, Watch Movies Online</title>
    <style>
        body {
            background-color: black;
        }

        * {
            padding: 0px;
            margin: 0px;
        }

        .main {
            background-image: url("background.jpg");
            height: 70vh;
            position: relative;
        }

        .main .box {
            height: 70vh;
            width: 100%;
            opacity: 0.44;
            background-color: black;
            position: absolute;
            top: 0px;
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 90vw;
            margin: auto;
            height: 60px;   
        }

        nav img {
            width: 150px;
            margin-top: 15px;
            position: relative;
            z-index: 12;
        }

        nav button {
            width: 80px;
            height: 35px;
            border-radius: 50px;
            background-color: black;
            color: white;
            position: relative;
            z-index: 12;
        }

        @import url('https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&display=swap');

        .center {
            height: calc(100% - 60px);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            position: relative;
            font-family: 'Merriweather', sans-serif;
            gap: 20px;
            padding: 0 30px;
            text-align: center;
        }

        .center> :nth-child(1) {
            font-size: 40px;
            font-weight: 700;
        }

        .center> :nth-child(2) {
            font-size: 20px;
            font-weight: 400;
        }

        .center> :nth-child(3) {
            font-size: 15px;
            font-weight: 300;
        }

        .center button {
            width: 110px;
            height: 40px;
            background-color: red;
            color: white;
            font-weight: 600;
            border-radius: 2px;
            padding: 10px;
        }

        .center input {
            width: 303px;
            height: 16px;
            background-color: black;
            color: white;
            padding: 10px;
            border-radius: 2px;
        }

        .line {
            height: 9px;
            background-color: rgb(53, 51, 51);
        }

        .end h2 {
            text-align: center;
        }

        .end {
            color: white;
            margin: 20px;
        }

        .fbx {
            transition: all 1s ease-out;
            max-width: 70vw;
            margin: auto;
            padding: 14px;
            background-color: rgb(62, 58, 58);
            border-radius: 5px;
            gap: 3px;
            margin-top: 6px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
        }
        .fbx:hover{
            background-color: rgb(12, 11, 11);
        }
    </style>
</head>

<body>
    <div class="main">
        <nav>
            <span> <img width="53px" src="Netflix_2015_logo.svg" alt=""></span>
            <div>
                <button>English</button>
                <button>Sign In</button>
            </div>
        </nav>
        <div class="box">
        </div>
        <div class="center">
            <span> Enjoy big movies, hit series and more from ₹149</span>
            <span>Join today. Cancel any time</span>
            <span>Ready to watch ? Enter your email to create or restart membership</span>
            <div>
                <input type="text" placeholder="Email Address">
                <button>Get Started ></button>
            </div>
        </div>
        <div class="line"></div>
    </div>
    <section class="end">
        <h2>Frequently Asked Question</h2>
        <div class="fbx">
            <span> What is Netflix?
            </span>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" color="#000000" fill="none">
                <path d="M12 4V20" stroke=white stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M4 12H20" stroke=white stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </div>
        <div class="fbx">
            <span>How much does Netflix Cost ?</span>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" color="#000000" fill="none">
                <path d="M12 4V20" stroke=white stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M4 12H20" stroke=white stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </div>
        <div class="fbx">
            <span> Where can I watch ?
            </span>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" color="#000000" fill="none">
                <path d="M12 4V20" stroke=white stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M4 12H20" stroke=white stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </div>
        <div class="fbx">
            <span> How can I Cancel?
            </span>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" color="#000000" fill="none">
                <path d="M12 4V20" stroke=white stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M4 12H20" stroke=white stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </div>
    </section>
</body>

</html>
